[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc", "src/llm", "src/agent"]

[project]
name = "mindcraft-py"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "javascript>=1.0.0",       # JSPyBridge — Python ↔ Node.js bridge
    "pydantic>=2.0",
    "numpy>=1.26",
    "litellm>=1.50",            # Unified LLM interface (100+ providers)
    "python-dotenv>=1.0",       # .env file loading
]

[project.optional-dependencies]
retrieval = [
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2",
]
llm = []
graph = [
    "networkx>=3.3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
    "ruff>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
