[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc", "src/llm", "src/agent"]

[project]
name = "mindcraft-py"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "langchain-openai>=0.3.0",  # ChatOpenAI + OpenAIEmbeddings
    "langchain-core>=0.3.0",    # BaseOutputParser, ChatPromptTemplate, MessagesPlaceholder
    "python-dotenv>=1.0",       # .env file loading
]

[project.optional-dependencies]
retrieval = [
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2",
]
llm = []
graph = [
    "networkx>=3.3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
    "ruff>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Match unit tests; test_e2e.py is excluded because it boots a Mineflayer
# subprocess and is meant to be invoked directly.
python_files = ["test_*.py"]
addopts = "--ignore=tests/test_e2e.py"
